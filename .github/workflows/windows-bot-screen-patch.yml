name: Windows Bot Screen patch build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Validate immutable ref
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref }}
        run: |
          [[ "$BUILD_REF" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::ref must be a full lowercase commit SHA"
            exit 1
          }

      - name: Check out patched source
        uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Build unsigned Windows x64 installer
        shell: bash
        env:
          BUILD_REF: ${{ inputs.ref }}
          PYTHONUTF8: '1'
        run: |
          test "$(git rev-parse HEAD)" = "$BUILD_REF"
          python scripts/bundles/desktop.py --commit "$BUILD_REF" --variant bundled --clean

      - name: Upload installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hermes-desktop-win32-x64-bot-screen-fix
          path: apps/desktop/release/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
